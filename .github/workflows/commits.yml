name: Commits

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Mensajes con Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Revisar el asunto de cada commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          patron='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          malos=0
          while IFS= read -r asunto; do
            if [[ ! "$asunto" =~ $patron && ! "$asunto" =~ ^Merge\  ]]; then
              echo "::error::No sigue Conventional Commits: $asunto"
              malos=1
            fi
          done < <(git log --format=%s "$BASE..$CABEZA")
          if [ "$malos" -ne 0 ]; then
            echo "Formato: tipo(ámbito opcional): descripción. Ver https://www.conventionalcommits.org/es/v1.0.0/"
            exit 1
          fi
          echo "Todos los commits siguen Conventional Commits."

      - name: Revisar autoría de cada commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Solo se aceptan estos autores; nada de coautores ni firmas añadidas.
          permitidos='^(Cristian|Consterna|dependabot\[bot\])$'
          malos=0
          while IFS=$'\t' read -r sha autor emisor; do
            for nombre in "$autor" "$emisor"; do
              if [[ ! "$nombre" =~ $permitidos && "$nombre" != "GitHub" ]]; then
                echo "::error::Commit ${sha:0:7} con autor no permitido: $nombre"
                malos=1
                break
              fi
            done
            if git show -s --format=%B "$sha" | grep -qiE '^(co-authored-by|generated with)'; then
              echo "::error::Commit ${sha:0:7} trae una firma o coautor que no va"
              malos=1
            fi
          done < <(git log --format=$'%H\t%an\t%cn' "$BASE..$CABEZA")
          if [ "$malos" -ne 0 ]; then
            echo "Corrige el autor con: git rebase -r --exec 'git commit --amend --no-edit --reset-author' <rama base>"
            exit 1
          fi
          echo "Todos los commits son del autor del repositorio."
