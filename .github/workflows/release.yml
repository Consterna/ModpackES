name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  construir:
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar la release
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ModpackES-exe
          path: dist

      - name: Notas de la versión (del CHANGELOG)
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          version="${ETIQUETA#v}"
          awk -v v="$version" '
            /^## / { dentro = index($0, "## [" v "]") == 1; next }
            dentro && /^\[[^]]+\]: / { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || { echo "No hay sección $version en CHANGELOG.md"; exit 1; }
          {
            echo
            echo "### Descarga"
            echo
            echo "Baja **ModpackES.exe** de los archivos de abajo y ábrelo (no necesita instalación)."
            echo
            echo "SHA-256: \`$(sha256sum dist/ModpackES.exe | cut -d' ' -f1)\`"
          } >> notas.md
          cat notas.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: gh release create "$ETIQUETA" dist/ModpackES.exe --title "ModpackES ${ETIQUETA#v}" --notes-file notas.md --verify-tag
