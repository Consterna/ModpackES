name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  construir:
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar la release
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # crear la release
      id-token: write  # firmar la atestación (Sigstore)
      attestations: write
      actions: read  # SignPath descarga el artefacto sin firmar
    env:
      # Solo se firma si el repositorio tiene configurado SignPath (ver docs/firma.md)
      FIRMAR: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ModpackES-exe
          path: dist

      - name: Firmar con SignPath
        if: env.FIRMAR == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.construir.outputs.artefacto }}
          wait-for-completion: true
          output-artifact-directory: dist  # reemplaza el .exe sin firmar

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Lista de componentes (SBOM CycloneDX)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > requisitos.txt
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py requirements requisitos.txt --of JSON -o dist/ModpackES-sbom.cdx.json

      - name: Atestación de origen del .exe
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/ModpackES.exe

      - name: Notas de la versión (del CHANGELOG)
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          version="${ETIQUETA#v}"
          awk -v v="$version" '
            /^## / { dentro = index($0, "## [" v "]") == 1; next }
            dentro && /^\[[^]]+\]: / { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || { echo "No hay sección $version en CHANGELOG.md"; exit 1; }
          {
            echo
            echo "### Descarga"
            echo
            echo "Baja **ModpackES.exe** de los archivos de abajo y ábrelo (no necesita instalación)."
            echo
            echo "SHA-256: \`$(sha256sum dist/ModpackES.exe | cut -d' ' -f1)\`"
            echo
            echo "Para comprobar que el archivo lo construyó este repositorio en GitHub Actions:"
            echo
            echo "\`\`\`"
            echo "gh attestation verify ModpackES.exe -R ${GITHUB_REPOSITORY}"
            echo "\`\`\`"
            echo
            echo "\`ModpackES-sbom.cdx.json\` lista las bibliotecas que van dentro (formato CycloneDX)."
            if [ "$FIRMAR" = "true" ]; then
              echo
              echo "Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
            fi
          } >> notas.md
          cat notas.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: >-
          gh release create "$ETIQUETA" dist/ModpackES.exe dist/ModpackES-sbom.cdx.json
          --title "ModpackES ${ETIQUETA#v}" --notes-file notas.md --verify-tag
