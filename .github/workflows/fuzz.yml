name: Fuzzing

# Fuzzing largo de los parsers de formatos (scripts/auditoria/fuzz_parsers.py), un trabajo por parser en paralelo.
# Solo se lanza a mano: Actions → Fuzzing → Run workflow. Si un parser falla, sube los casos que lo rompen.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: Minutos de fuzzing por parser
        type: choice
        options: ["60", "20", "5"]
        default: "60"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzzing de ${{ matrix.parser }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        parser: [snbt, nbt, json_cadenas, json_texto, lang_json, lang_json5, lang_legacy, javascript, comandos,
                 componente, markdown, propiedades, options, version, zip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # el token no queda en .git para los pasos siguientes

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Semillas del corpus público (partes de modpacks de Modrinth)
        continue-on-error: true  # sin red, el fuzzing sigue con las semillas de tests/ y las generadas
        run: uv run python scripts/descargar_corpus.py

      - name: Fuzzing
        env:
          MINUTOS: ${{ inputs.minutos }}
          PARSER: ${{ matrix.parser }}
          FUZZ_SALIDA: ${{ runner.temp }}/fuzz
        run: uv run python scripts/auditoria/fuzz_parsers.py "$MINUTOS" "$PARSER"

      - name: Casos que fallaron
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-${{ matrix.parser }}
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore
          retention-days: 14
