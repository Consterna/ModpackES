name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Verificar y construir el .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Bajar Gson para el validador Java
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gson.jar" "https://repo1.maven.org/maven2/com/google/code/gson/gson/${GSON_VERSION}/gson-${GSON_VERSION}.jar"
          echo "${GSON_SHA256}  $RUNNER_TEMP/gson.jar" | sha256sum -c -
          echo "TRADUCTOR_ES_GSON=$RUNNER_TEMP/gson.jar" >> "$GITHUB_ENV"
        env:
          GSON_VERSION: "2.13.2"  # si se cambia, también el SHA-256 (de Maven Central)
          GSON_SHA256: dd0ce1b55a3ed2080cb70f9c655850cda86c206862310009dcb5e5c95265a5e0

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Puerta de calidad (ruff, pyright y pytest con el validador Java)
        run: uv run python scripts/verificar.py

      - name: Construir ModpackES.exe
        run: uv run python scripts/construir_exe.py

      - name: Probar el .exe
        run: uv run python scripts/probar_exe.py

      - uses: actions/upload-artifact@v7
        with:
          name: ModpackES-exe
          path: dist/ModpackES.exe
          if-no-files-found: error
          retention-days: 14
