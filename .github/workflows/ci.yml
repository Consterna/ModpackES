name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Verificar y construir el .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Bajar Gson para el validador Java
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gson.jar" "https://repo1.maven.org/maven2/com/google/code/gson/gson/${GSON_VERSION}/gson-${GSON_VERSION}.jar"
          echo "${GSON_SHA256}  $RUNNER_TEMP/gson.jar" | sha256sum -c -
          echo "TRADUCTOR_ES_GSON=$RUNNER_TEMP/gson.jar" >> "$GITHUB_ENV"
        env:
          GSON_VERSION: "2.13.2"  # si se cambia, también el SHA-256 (de Maven Central)
          GSON_SHA256: dd0ce1b55a3ed2080cb70f9c655850cda86c206862310009dcb5e5c95265a5e0

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Puerta de calidad (ruff, pyright y pytest con el validador Java)
        run: uv run python scripts/verificar.py

      - name: Construir ModpackES.exe
        run: uv run python scripts/construir_exe.py

      - name: Probar el .exe
        run: uv run python scripts/probar_exe.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ModpackES-exe
          path: dist/ModpackES.exe
          if-no-files-found: error
          retention-days: 14
