[project]
name = "modpackes"
version = "2.2.0"
description = "Traduce modpacks de Minecraft al español: misiones, libros guía, scripts y mods."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Cristian" }]
keywords = ["minecraft", "modpack", "traduccion", "espanol", "ftb-quests", "patchouli", "kubejs", "gemini"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "google-genai>=2.34.0",
    "httpx>=0.28",
    "json5>=0.9",
    "keyring>=25.7.0",
    "platformdirs>=4.2",
    "pyside6-essentials>=6.12.0",
]

[project.urls]
Homepage = "https://github.com/Consterna/ModpackES"
Issues = "https://github.com/Consterna/ModpackES/issues"
Changelog = "https://github.com/Consterna/ModpackES/blob/main/CHANGELOG.md"

[project.scripts]
modpackes = "traductor_es.__main__:main"

[project.gui-scripts]
modpackes-ventana = "traductor_es.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "nbtlib>=2.0.4",
    "pytest-qt>=4.5.0",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traductor_es"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "C90"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complejidad: se controla en revisión
    "RUF001", "RUF002", "RUF003",                              # el código usa español con tildes y ⟦⟧ a propósito
]

[tool.ruff.lint.mccabe]
max-complexity = 15  # más que esto se parte en funciones con nombre

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "S101", "E501"]  # los datos de prueba reales (JSON, SNBT) van en una línea
"src/traductor_es/ui/tema.py" = ["E501"]  # cada regla de la hoja QSS va en una línea

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "java: necesita el validador Java (se salta si no hay JDK)",
    "corpus: usa copias de modpacks reales en .corpus/ (se salta si no existen)",
]

[tool.coverage.run]
source = ["traductor_es"]
branch = true
