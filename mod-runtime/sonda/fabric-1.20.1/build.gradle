plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "modpackes_sonda-fabric-${project.minecraft_version}"
}

version = project.mod_version
group = project.mod_group_id

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
	def propiedades = [
		version    : project.mod_version,
		mod_id     : project.mod_id,
		mod_name   : project.mod_name,
		mod_license: project.mod_license,
		mod_authors: project.mod_authors,
		mod_description: project.mod_description,
		minecraft_range: project.minecraft_range,
	]
	// gradle.properties se lee como ISO-8859-1 (sus tildes van escapadas) y los metadatos se escriben en UTF-8
	filteringCharset = 'UTF-8'
	inputs.properties propiedades
	filesMatching("fabric.mod.json") {
		expand propiedades
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17 // Minecraft 1.20.1 funciona con Java 17
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Loom pasa los mixins a los nombres intermediarios y añade el refmap al JSON de mixins al empaquetar.
// La lógica pura vive en ../comun (con sus pruebas); lo que usa Minecraft y no cambia entre 1.20.1 y 1.21.1, en
// ../comun-mc; lo propio de 1.20.1, en ../comun-1.20.1
sourceSets {
	main.java.srcDir '../comun/src/main/java'
	main.java.srcDir '../comun-mc/src/main/java'
	main.java.srcDir '../comun-1.20.1/src/main/java'
	test.java.srcDir '../comun/src/test/java'
}

tasks.named('test', Test).configure {
	useJUnitPlatform()
}
