// Forge 1.12.2 se construye con ForgeGradle 2.3, Gradle 4.10.3 y Java 8 (nada más nuevo lo soporta).
buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group_id
archivesBaseName = "${mod_id}-forge-${minecraft_version}"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
compileTestJava {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = 'run'
    mappings = mapping_version
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version,
                'id': mod_id, 'name': mod_name, 'desc': mod_description, 'authors': mod_authors
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// La lógica común vive en ../comun: la tabla es de todos y el reescritor depende de cómo guarda el texto esa versión
sourceSets {
    main.java.srcDir '../comun/tabla/src/main/java'
    main.java.srcDir '../comun/reescritor-1122/src/main/java'
    test.java.srcDir '../comun/tabla/src/test/java'
    test.java.srcDir '../comun/reescritor-1122/src/test/java'
}

test {
    useJUnitPlatform()
}
