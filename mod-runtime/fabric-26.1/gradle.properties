# Versiones en las que el mismo código compila y pasa las pruebas (comprobado con `construir_mod.py --propiedad`)
minecraft_range=>=26.1 <=26.3
loader_version=0.18.4
loom_version=1.19.4
fabric_api_version=0.145.1+26.1

mod_id=modpackes_runtime
mod_name=ModpackES Runtime
mod_license=GPL-3.0-or-later
mod_version=0.1.0
mod_group_id=io.github.consterna.modpackes
mod_authors=Consterna
mod_description=Muestra en español el texto que otros mods escriben en su código y que un resource pack no puede traducir. Solo cambia mensajes de chat, de la barra de acción y tooltips cuyo texto está en la tabla que genera ModpackES.
